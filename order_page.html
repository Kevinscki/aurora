<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin is Ordering...</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #00ff41;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        p {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 40px;
        }
        .status {
            font-weight: bold;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kelvin is Ordering Something</h1>
        <p>The kitchen is getting ready...</p>
        <div class="status" id="timer">00:00:00</div>
        <br>
        <button onclick="alert('Order placed! (Fake)')" style="margin-top: 20px; padding: 15px 30px; background: transparent; border: 1px solid #00ff41; color: #00ff41; cursor: pointer;">
            REVEAL ORDER DETAILS
        </button>
    </div>

    <script>
        let seconds = 60; // Countdown starts at 60 seconds
        const timerElement = document.getElementById('timer');
        
        const interval = setInterval(() => {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            
            timerElement.textContent = `${h}:${m}:${s}`;
            
            if (seconds > 0) {
                seconds--;
            } else {
                clearInterval(interval);
                timerElement.textContent = "ORDER PLACED";
                setTimeout(() => alert("Order Placed! (This is fake, Kelvin. No money charged.)"), 100);
            }
        }, 1000);
    </script>
</body>
</html>
