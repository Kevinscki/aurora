<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin Rutatina | Security Operator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="boot-screen">
        <div class="boot-container">
            <div id="boot-text"></div>
            <div class="loader-bar"><div class="progress"></div></div>
        </div>
    </div>

    <div id="desktop">
        <div class="wallpaper"></div>
        
        <!-- Top Menu Bar (Mac Style) -->
        <div id="menu-bar">
            <div class="menu-left">
                <span class="apple-logo"></span>
                <span class="menu-item bold">KelvinOS</span>
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Garden</span>
            </div>
            <div class="menu-right">
                <span id="clock">00:00</span>
            </div>
        </div>

        <!-- Desktop Icons -->
        <div class="icon-grid">
            <div class="desktop-icon" onclick="openWindow('hub-window')">
                <div class="icon-img">🌿</div>
                <span class="icon-label">Knowledge Hub</span>
            </div>
        </div>

        <!-- The Hub Window (Projects + Garden) -->
        <div id="hub-window" class="window" style="display:none;">
            <div class="window-header">
                <div class="window-controls">
                    <span class="dot red" onclick="closeWindow('hub-window')"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="window-title">Knowledge Hub — Digital Garden</div>
            </div>
            <div class="window-content">
                <div class="hub-layout">
                    <aside class="hub-sidebar">
                        <div class="sidebar-section">
                            <h4>Strategy</h4>
                            <div class="nav-item active" onclick="filterHub('00')">00_STRATEGY</div>
                            <div class="nav-item" onclick="filterHub('10')">10_OFFENSIVE</div>
                            <div class="nav-item" onclick="filterHub('20')">20_DEFENSIVE</div>
                            <div class="nav-item" onclick="filterHub('30')">30_ARCHIVE</div>
                        </div>
                    </aside>
                    <main class="hub-main" id="hub-content">
                        <!-- Content injected by JS -->
                    </main>
                </div>
            </div>
        </div>

        <!-- The Terminal (Mac Style) -->
        <div id="terminal-window" class="window" style="display:none;">
            <div class="window-header">
                <div class="window-controls">
                    <span class="dot red" onclick="closeWindow('terminal-window')"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="window-title">zsh — kelvin@operator</div>
            </div>
            <div class="terminal-body">
                <div id="term-output"></div>
                <div class="term-input-line">
                    <span class="prompt">kelvin@operator ~ %</span>
                    <input type="text" id="term-input" autofocus spellcheck="false">
                </div>
            </div>
        </div>

        <!-- Dock -->
        <div id="dock-container">
            <div id="dock">
                <div class="dock-item" onclick="openWindow('hub-window')" title="Knowledge Hub">🌿</div>
                <div class="dock-item" onclick="toggleTerminal()" title="Terminal">📟</div>
                <div class="dock-item" onclick="window.open('https://linkedin.com/in/kelvinrutatina')" title="LinkedIn">💼</div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
