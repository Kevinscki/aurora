<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Awareness Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Cyber Security Challenge</h1>
            <p>Test your knowledge of online safety with this crossword puzzle!</p>
        </header>

        <div class="main-layout">
            <div class="puzzle-section">
                <div id="crossword-grid" class="grid">
                    <!-- Grid generated by JS -->
                </div>
                <div class="controls">
                    <button id="check-btn" class="btn primary">Check Answers</button>
                    <button id="reset-btn" class="btn secondary">Reset Grid</button>
                </div>
                <p id="feedback"></p>
            </div>

            <div class="clues-section">
                <div class="clue-group">
                    <h3>Across</h3>
                    <ul id="across-clues"></ul>
                </div>
                <div class="clue-group">
                    <h3>Down</h3>
                    <ul id="down-clues"></ul>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
