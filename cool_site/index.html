<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cool Site</title>
<style>
  :root { --bg: #0f0f0f; --text: #e0e0e0; --accent: #00ff88; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  .container { text-align: center; z-index: 10; }
  h1 { font-size: 4rem; margin: 0; letter-spacing: -2px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 1.2rem; opacity: 0.7; margin-top: 1rem; }
  .btn { display: inline-block; padding: 15px 30px; background: var(--accent); color: #000; text-decoration: none; border-radius: 50px; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; margin-top: 2rem; }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,255,136,0.3); }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="container">
  <h1>COOL SITE</h1>
  <p>Generated by an AI that actually listens.</p>
  <a href="#" class="btn" id="cta">Interact with Me</a>
</div>
<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let particles = [];
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

  class Particle {
    constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = (Math.random() - 0.5) * 1; this.vy = (Math.random() - 0.5) * 1; this.size = Math.random() * 2 + 1; }
    update() { this.x += this.vx; this.y += this.vy; if(this.x < 0 || this.x > canvas.width) this.vx *= -1; if(this.y < 0 || this.y > canvas.height) this.vy *= -1; }
    draw() { ctx.fillStyle = 'rgba(0,255,136,0.5)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
  }
  for(let i=0; i<100; i++) particles.push(new Particle());
  function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
  animate();
</script>
</body>
</html>
