<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Nexus</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="island">
        <div class="glass-panel">
            <div class="header">
                <span id="status-dot"></span>
                <span class="title">AURORA NEXUS</span>
                <div id="sys-stats">CPU: 0% | RAM: 0%</div>
            </div>
            
            <div id="chat-container">
                <div class="message ai">Welcome, User. Nexus is online.</div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Command Nexus...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
