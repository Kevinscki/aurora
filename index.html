<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kelvin's Interactive Terminal</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; padding: 2rem; margin: 0; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
        #terminal { flex-grow: 1; overflow-y: auto; border: 1px solid #30363d; border-radius: 4px; padding: 1rem; margin-bottom: 1rem; background: #161b22; }
        .log-entry { margin-bottom: 0.5rem; }
        .timestamp { color: #8b949e; font-size: 0.85em; margin-right: 1rem; }
        .command { color: #79c0ff; }
        .output { color: #3fb950; }
        input { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 0.5rem; font-family: 'Courier New', monospace; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: #58a6ff; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <input type="text" id="commandInput" placeholder="Enter a command..." autocomplete="off">
    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('commandInput');

        function log(message, type = 'output') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            let content = '';
            if (type === 'command') {
                content = `<span class="timestamp">[${timeString}]</span><span class="command">$ ${message}</span>`;
            } else {
                content = `<span class="timestamp">[${timeString}]</span><span class="output">${message}</span>`;
            }
            
            entry.innerHTML = content;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function processCommand(cmd) {
            const trimmedCmd = cmd.trim();
            if (!trimmedCmd) return;

            log(trimmedCmd, 'command');

            // Simple command processing
            if (trimmedCmd === 'help') {
                log('Available commands: help, clear, date, echo <text>, whoami', 'output');
            } else if (trimmedCmd === 'clear') {
                terminal.innerHTML = '';
            } else if (trimmedCmd.startsWith('date')) {
                log(new Date().toString(), 'output');
            } else if (trimmedCmd.startsWith('echo ')) {
                const text = trimmedCmd.slice(5);
                log(text, 'output');
            } else if (trimmedCmd === 'whoami') {
                log('Kelvin', 'output');
            } else {
                log(`Command not found: ${trimmedCmd}`, 'output');
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                input.value = '';
                processCommand(cmd);
            }
        });

        log('Welcome to Kelvin\'s Interactive Terminal. Type "help" for commands.', 'output');
    </script>
</body>
</html>
