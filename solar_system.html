<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kelvin's Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: monospace; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 4px;
            pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>
<div id="ui">Kelvin's Solar System<br>Zoom: Mouse Wheel | Pan: Drag</div>
<canvas id="sim"></canvas>
<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
let width, height;

// Planet Data (Simplified scales)
const planets = [
    { name: "Sun",     r: 25,   x: 0, y: 0,    color: "#FFD700", speed: 0,    size: 40 },
    { name: "Mercury", r: 3,   x: 60, y: 0,    color: "#A9A9A9", speed: 0.02, size: 3 },
    { name: "Venus",   r: 5,   x: 110, y: 0,   color: "#E6E6FA", speed: 0.015,size: 5 },
    { name: "Earth",   r: 5.5, x: 165, y: 0,   color: "#00BFFF", speed: 0.01, size: 5.5 },
    { name: "Mars",    r: 3.5, x: 220, y: 0,   color: "#FF4500", speed: 0.008,size: 3.5 },
    { name: "Jupiter", r: 12,  x: 290, y: 0,   color: "#DAA520", speed: 0.004,size: 12 },
    { name: "Saturn",  r: 10,  x: 360, y: 0,   color: "#F4A460", speed: 0.003,size: 10 },
];

// Starfield
const stars = [];
for(let i=0; i<200; i++) {
    stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5
    });
}

let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mousemove', e => {
    if(isDragging) {
        offsetX += (e.clientX - lastMouseX);
        offsetY += (e.clientY - lastMouseY);
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    }
});
window.addEventListener('wheel', e => { scale *= e.deltaY > 0 ? 0.9 : 1.1; });

function drawStars() {
    ctx.fillStyle = "white";
    stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
}

function drawPlanets() {
    ctx.save();
    ctx.translate(offsetX + width/2, offsetY + height/2);
    
    // Draw Orbit Lines (Simplified)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.beginPath();
    for(let p of planets.slice(1)) {
        ctx.arc(p.x, 0, p.r * 4, 0, Math.PI * 2);
    }
    ctx.stroke();

    planets.forEach(p => {
        // Draw Planet
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, 0, p.r, 0, Math.PI*2);
        ctx.fill();
        
        // Glow effect for Sun
        if(p.name === "Sun") {
            ctx.shadowBlur = 40;
            ctx.shadowColor = p.color;
        } else {
            ctx.shadowBlur = 0;
        }
    });

    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, width, height);
    
    drawStars();
    drawPlanets();

    // Simple animation logic (just visual position shifts)
    planets.forEach(p => {
        if(p.name !== "Sun") {
            p.x += Math.cos(Date.now() / 1000) * 0.5; 
        }
    });

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
